[package]
name = "vault_core"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Isolated offline vault core: test mnemonic derivation, zeroize memory, and controlled software signing"

[dependencies]
public_core = { path = "../public_core" }
secp256k1 = { version = "=0.33.1", features = ["recovery", "global-context", "alloc"] }
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
bip39 = "2.1.0"
bip32 = "0.5.3"
hex = "0.4.3"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
getrandom = "0.3.4"
pbkdf2 = "0.12.2"
hmac = "0.12.1"
sha2 = "0.10.9"
ur_adapter = { path = "../ur_adapter" }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
# Unify the AEAD's existing transitive dependencies with key-state zeroization.
aes = { version = "=0.8.4", features = ["zeroize"] }
ghash = { version = "=0.5.1", features = ["zeroize"] }
