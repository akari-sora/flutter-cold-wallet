[package]
name = "wallet_ffi"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Watch-only wallet FFI bridge: strictly no seed intake, no private key storage, no local signing APIs"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
test-fixtures = []

[dependencies]
public_core = { path = "../public_core" }
nfc_protocol = { path = "../nfc_protocol" }
signer_router = { path = "../signer_router" }
ur_adapter = { path = "../ur_adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
secp256k1 = { version = "=0.33.1", features = ["recovery", "global-context", "alloc"] }
bip32 = "0.5.3"
