[package]
name = "signer_router"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Multi-transport signer router, hardware backend abstraction, and immutable PreparedRequest state machine"

[dependencies]
public_core = { path = "../public_core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
hex = "0.4.3"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
