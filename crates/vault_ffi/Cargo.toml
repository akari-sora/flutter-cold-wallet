[package]
name = "vault_ffi"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Offline vault FFI bridge: opaque PreparedRequest handles, policy verification, and zeroize-managed signing"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
test-fixtures = []

[dependencies]
public_core = { path = "../public_core" }
vault_core = { path = "../vault_core" }
signer_router = { path = "../signer_router" }
nfc_protocol = { path = "../nfc_protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
ur_adapter = { path = "../ur_adapter" }
