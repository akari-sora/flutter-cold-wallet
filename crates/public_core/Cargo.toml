[package]
name = "public_core"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Public models, EVM transaction parser, fail-closed policy, and signature verification with zero private key APIs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
hex = "0.4.3"
thiserror = "2.0"
secp256k1 = { version = "=0.33.1", features = ["recovery", "global-context", "alloc"] }
sha2 = "0.10"
ripemd = "0.1"

[dev-dependencies]
ciborium = "=0.2.2"
