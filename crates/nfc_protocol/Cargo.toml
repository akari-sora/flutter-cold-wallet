[package]
name = "nfc_protocol"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Bounded NFC transport envelope, APDU chunking, and session state machine with zero secret leakage"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "=0.2.2"
hex = "0.4.3"
thiserror = "2.0"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
sha2 = { version = "0.10", default-features = false }
