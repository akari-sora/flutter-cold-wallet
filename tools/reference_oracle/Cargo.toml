[package]
name = "reference_oracle"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Reference Oracle Algorithm A: Rust native BIP-39/BIP-32 key derivation and EIP-55 address calculator"

[dependencies]
bip39 = "2.1.0"
bip32 = "0.5.3"
secp256k1 = { version = "=0.33.1", features = ["recovery", "global-context", "alloc"] }
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
