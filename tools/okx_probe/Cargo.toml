[package]
name = "okx_probe"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Keystone-compatible crypto-multi-accounts probe and animated fountain QR player for OKX Wallet pairing verification"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
secp256k1 = { version = "=0.33.1", features = ["recovery", "global-context", "alloc"] }
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
ur = "=0.5.2"
ciborium = "=0.2.2"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = { version = "0.14.1", default-features = false }
image = { version = "0.25.5", default-features = false, features = ["png", "gif"] }
bip39 = "2.1.0"
bip32 = "0.5.3"
